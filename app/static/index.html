<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFP Manager</title>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
          --accent: #2f5bea; --ok: #1f8a4c; --bad: #c0392b; --must: #8a5a00; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px;
           font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: none; color: var(--accent); border: 1px solid var(--accent); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 0; }
  #status { color: var(--muted); margin: 0; }
  /* Debug views (metrics, section cards, ids, checks) only show after "Show details". */
  body:not(.details) .details-only { display: none !important; }
  .headline { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
  .muted { color: var(--muted); margin: 4px 0 0; }
  .due { margin: 6px 0 0; font-size: 17px; color: var(--bad); }
  .group { margin: 4px 0; }
  .group summary { cursor: pointer; font-weight: 600; text-transform: capitalize; }
  .check { display: block; padding: 2px 0 2px 20px; text-indent: -20px; }
  .section { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
             margin-bottom: 12px; padding: 12px 16px; }
  .section h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; gap: 12px; }
  .section h2 span { color: var(--muted); font-weight: normal; white-space: nowrap; }
  .pending { color: var(--muted); }
  .req { border-top: 1px solid var(--line); padding: 8px 0; }
  .req:first-of-type { margin-top: 8px; }
  .tags { display: flex; gap: 6px; margin-bottom: 2px; font-size: 12px; }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
  .must { color: var(--must); border-color: var(--must); }
  .ok { color: var(--ok); border-color: var(--ok); }
  .bad { color: var(--bad); border-color: var(--bad); }
  .quote { color: var(--muted); font-size: 13px; font-style: italic; }
  .error { color: var(--bad); }
  #summary .section { border-color: var(--accent); }
  #summary h3 { font-size: 14px; margin: 16px 0 4px; }
  #summary ol, #summary ul { margin: 0; padding-left: 20px; }
  #summary li { margin-bottom: 6px; }
  .ids { color: var(--muted); font-size: 12px; }
  .high { color: var(--bad); border-color: var(--bad); }
  .medium { color: var(--must); border-color: var(--must); }
  .review { border-left: 3px solid var(--bad); padding-left: 8px; }
  .judge { color: var(--bad); font-size: 13px; }
  #quality { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 16px; }
  .metric { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .metric b { display: block; font-size: 20px; }
  .metric span { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>RFP Manager</h1>
  <p class="sub">Upload an RFP (PDF, DOCX, TXT, MD). Requirements are extracted section by section.</p>

  <form id="form">
    <input type="file" id="file" name="file" accept=".pdf,.docx,.txt,.md" required>
    <button id="run">Extract requirements</button>
  </form>

  <div class="toolbar">
    <p id="status"><span id="progress"></span><span id="stats" class="details-only"></span></p>
    <button id="toggle" class="secondary" type="button" hidden>Show details</button>
  </div>
  <div id="quality" class="details-only"></div>
  <div id="summary"></div>
  <div id="results" class="details-only"></div>
</main>

<script>
const form = document.getElementById("form");
const runBtn = document.getElementById("run");
const progressEl = document.getElementById("progress");
const statsEl = document.getElementById("stats");
const toggleBtn = document.getElementById("toggle");
const results = document.getElementById("results");
const summaryEl = document.getElementById("summary");
const qualityEl = document.getElementById("quality");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderSection(card, event) {
  if (event.skipped) {
    card.querySelector("h2 span").textContent = "skipped";
    card.querySelector(".pending").textContent = "Skipped: boilerplate, not sent to the model.";
    return;
  }
  card.querySelector("h2 span").textContent =
    `${event.requirements.length} reqs · ${event.seconds}s`;
  card.querySelector(".pending")?.remove();
  if (event.error) card.append(el("p", "error", event.error));

  for (const r of event.requirements) {
    const flagged = !r.quote_found || r.duplicate_of || (r.verdict && r.verdict !== "same");
    const req = el("div", "req" + (flagged ? " review" : ""));
    const tags = el("div", "tags");
    tags.append(el("span", "tag " + (r.quote_found ? "ok" : "bad"),
                   r.quote_found ? "quote found" : "quote NOT found"));
    if (r.verdict) tags.append(el("span", "tag " + (r.verdict === "same" ? "ok" : "bad"),
                                  r.verdict === "same" ? "faithful" : r.verdict));
    if (r.duplicate_of) tags.append(el("span", "tag bad", "duplicate of " + r.duplicate_of));
    if (r.mandatory) tags.append(el("span", "tag must", "mandatory"));
    tags.append(el("span", "tag", r.category));
    req.append(tags, el("div", "", `${r.id} · ${r.description}`), el("div", "quote", `“${r.quote}”`));
    if (r.verdict && r.verdict !== "same") req.append(el("div", "judge", "Judge: " + r.verdict_reason));
    card.append(req);
  }
}

function pct(v) { return v === null || v === undefined ? "n/a" : Math.round(v * 100) + "%"; }

function renderQuality(q) {
  qualityEl.innerHTML = "";
  const metrics = [
    [pct(q.quote_found_rate), "quotes found in source"],
    [pct(q.faithfulness_rate), `faithful (judge, ${q.judged} judged)`],
    [q.duplicates, "duplicates"],
    [q.needs_review.length, "need review"],
    [q.unknown_ids ?? "n/a", "made-up ids in summary"],
    [q.uncovered_mandatory ?? "n/a", "mandatory not planned"],
  ];
  for (const [value, label] of metrics) {
    const m = el("div", "metric");
    m.append(el("b", "", String(value)), el("span", "", label));
    qualityEl.append(m);
  }
}

function renderSummary(event) {
  const card = el("div", "section");
  summaryEl.append(card);
  if (event.error) { card.append(el("p", "error", "Summary failed: " + event.error)); return; }

  const s = event.summary;
  // Duplicates stay visible in the section cards (details view), not in the summary.
  const reqs = s.requirements.filter((r) => !r.duplicate_of);
  const must = reqs.filter((r) => r.mandatory);
  const flagged = reqs.filter((r) => !r.quote_found || (r.verdict && r.verdict !== "same"));

  const header = el("div", "headline");
  const due = el("p", "due");
  if (s.deadline) {
    due.append(el("strong", "", "Due: " + s.deadline.date), " ",
               el("span", "ids", `${s.deadline.label} · ${s.deadline.section_id}`));
  } else {
    due.append(el("span", "ids", "No submission deadline found in the document: check it manually."));
  }
  header.append(
    el("h2", "", `${s.project_title} · ${s.client}`),
    due,
    el("p", "muted", `${reqs.length} requirements (${must.length} must · ${reqs.length - must.length} optional)` +
                     ` · ${flagged.length} flagged for review`),
  );
  card.append(header, el("p", "", s.overview));

  card.append(el("h3", "", "Approach"));
  const phases = el("ol");
  for (const p of s.approach) {
    const li = el("li");
    li.append(el("strong", "", p.phase + ": "), p.description, " ",
              el("span", "ids details-only", p.requirement_ids.join(", ")));
    phases.append(li);
  }
  card.append(phases);

  // Top 5 risks by severity; the rest only in the details view.
  const order = { high: 0, medium: 1, low: 2 };
  const sorted = [...s.risks].sort((a, b) => order[a.severity] - order[b.severity]);
  card.append(el("h3", "", "Top risks"));
  const risks = el("ul");
  sorted.forEach((r, i) => {
    const li = el("li", i < 5 ? "" : "details-only");
    li.append(el("span", "tag " + r.severity, r.severity), " ", r.description,
              el("div", "quote", "Mitigation: " + r.mitigation),
              el("span", "ids details-only", r.requirement_ids.join(", ")));
    risks.append(li);
  });
  card.append(risks);

  // Must-haves only, grouped by category, one checkbox each.
  card.append(el("h3", "", `Compliance checklist (${must.length} must-haves)`));
  const groups = {};
  for (const r of must) (groups[r.category] ||= []).push(r);
  for (const [category, items] of Object.entries(groups)) {
    const group = el("details", "group");
    group.append(el("summary", "", `${category} (${items.length})`));
    for (const r of items) {
      const label = el("label", "check");
      const box = el("input");
      box.type = "checkbox";
      label.append(box, " ", r.description, " ", el("span", "ids details-only", r.id));
      group.append(label);
    }
    card.append(group);
  }

  const checks = el("div", "details-only");
  checks.append(
    el("h3", "", "Checks"),
    el("p", s.unknown_ids.length ? "error" : "",
       `Made-up requirement ids: ${s.unknown_ids.join(", ") || "none"}`),
    el("p", s.uncovered_mandatory.length ? "error" : "",
       `Mandatory requirements no phase covers: ${s.uncovered_mandatory.join(", ") || "none"}`),
  );
  card.append(checks);
}

let detailsLabel = "extraction details";
function updateToggle() {
  const on = document.body.classList.contains("details");
  toggleBtn.textContent = `${on ? "▾ Hide" : "▸ Show"} ${detailsLabel}`;
}
toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("details");
  updateToggle();
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  results.innerHTML = "";
  summaryEl.innerHTML = "";
  qualityEl.innerHTML = "";
  statsEl.textContent = "";
  runBtn.disabled = true;
  toggleBtn.hidden = false;
  detailsLabel = "extraction details";
  updateToggle();
  progressEl.textContent = "Reading document…";

  const body = new FormData();
  body.append("file", document.getElementById("file").files[0]);

  try {
    const res = await fetch("/extract", { method: "POST", body });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);

    const cards = {};
    let total = 0, done = 0, reqCount = 0;
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";

    while (true) {
      const { value, done: finished } = await reader.read();
      if (finished) break;
      buffer += value;
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines.filter(Boolean)) {
        const event = JSON.parse(line);
        if (event.type === "sections") {
          total = event.sections.length;
          for (const s of event.sections) {
            const card = el("div", "section");
            const h = el("h2", "", `[${s.id}] ${s.title}`);
            h.append(el("span", "", `${s.chars.toLocaleString()} chars`));
            card.append(h, el("p", "pending", "Waiting…"));
            results.append(card);
            cards[s.id] = card;
          }
        } else if (event.type === "section") {
          done++;
          reqCount += event.requirements.length;
          renderSection(cards[event.id], event);
          progressEl.textContent = done < total
            ? `Reading section ${done + 1} of ${total}…`
            : "Writing summary…";
          statsEl.textContent = ` · ${reqCount} requirements so far`;
        } else if (event.type === "summary") {
          renderSummary(event);
        } else if (event.type === "done") {
          renderQuality(event.quality);
          const t = event.totals;
          progressEl.textContent = "Done";
          const tokens = t.prompt_tokens + t.completion_tokens;
          detailsLabel = `extraction details (${total} sections · ${(t.latency_s / 60).toFixed(1)} min · ` +
                         `${Math.round(tokens / 1000)}K tokens)`;
          updateToggle();
          statsEl.textContent = ` · ${done}/${total} sections · ${reqCount} requirements · ` +
            `${t.prompt_tokens + t.completion_tokens} tokens · ${t.latency_s}s · ~$${t.cost_usd.toFixed(4)}`;
        }
      }
    }
  } catch (err) {
    progressEl.textContent = "Error: " + err.message;
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
